<!doctype html>
<html lang="en" class="calcite-mode-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23333'/%3E%3Ctext x='50' y='65' font-size='55' text-anchor='middle' fill='%2300b9f2'%3E%F0%9F%8C%90%3C/text%3E%3C/svg%3E" />
    <title>Imagery Data Assistant</title>

    <!-- GoatCounter. The deployed copy lives at a nested S3 key, so the real
         page path is /apps/imagery-assistant/index.html. Report one fixed
         name instead, both to keep the row readable and so it does not move
         if the app is ever hosted somewhere else.
    -->
    <script>
      window.goatcounter = { path: '/imagery-assistant' }
    </script>
    <script data-goatcounter="https://bconnolly.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
